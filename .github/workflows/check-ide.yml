name: Check SuperCollision IDE
on:
  push:
    branches: [main]
    paths: ['index.html', 'instrument-layout.css', 'instrument-layout.js', 'live-activity.mjs', 'routine-trace.mjs', 'performance-engine.mjs', 'performance-ui.mjs', 'performance.css', 'learning.mjs', 'learning.css', 'catalog-core.mjs', 'editor-assist.mjs', 'catalog-assist.css', 'sound-designer.mjs', 'sound-designer-core.mjs', 'sound-designer.css', 'qa/sound-designer-test.mjs', 'qa/osc-priority-test.mjs', 'qa/catalog-test.mjs', 'qa/learning-test.mjs', 'qa/performance-test.mjs', 'qa/live-activity-test.mjs', '.github/workflows/check-ide.yml']
  pull_request:
    paths: ['index.html', 'instrument-layout.css', 'instrument-layout.js', '.github/workflows/check-ide.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts, editor structure and design variants
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts=[]
                  self.capture=False
                  self.current=''
              def handle_starttag(self, tag, attrs):
                  if tag=='script':
                      self.capture=not dict(attrs).get('src')
                      self.current=''
              def handle_data(self, data):
                  if self.capture:
                      self.current+=data
              def handle_endtag(self, tag):
                  if tag=='script' and self.capture:
                      self.scripts.append(self.current)
                      self.capture=False
          html=Path('index.html').read_text()
          css=Path('instrument-layout.css').read_text()
          js=Path('instrument-layout.js').read_text()
          p=Scripts()
          p.feed(html)
          assert len(p.scripts)==4, f"Found {len(p.scripts)} inline scripts"
          for i,script in enumerate(p.scripts):
              Path(f'/tmp/supercollision-{i}.js').write_text(script)
          expected=['<header>', 'class="projectbar"', 'class="editor-frame"', 'class="toolbar"', 'class="panel console-shell"']
          indices=[html.index(item) for item in expected]
          assert indices==sorted(indices), indices
          assert 'wrap="off"' in html
          assert 'id="line-inner"' in html
          assert all('id="inspector-'+v+'"' in html for v in ('code','console','perform','learn','design'))
          assert 'id="inspector-audio"' not in html
          assert 'id="audio-panel"' in html
          assert 'id="inspect-toggle"' not in html
          assert 'instrument-layout.css' in html and 'instrument-layout.js' in html
          assert "window.renderLineGutter" in html and "window.renderLineGutter" in js
          assert "translate3d" in js
          assert 'grid-template-columns:repeat(6,minmax(0,1fr))' in css
          for theme in ['bauhaus','blackmountain','moog','makenoise','score','scope','patch','terminal']:
              assert 'data-theme='+theme in css,theme
              assert 'art-'+theme in html,theme
          PY
          node --check /tmp/supercollision-0.js
          node --check /tmp/supercollision-1.js
          node --check /tmp/supercollision-2.js
          node --check /tmp/supercollision-3.js
          node --check instrument-layout.js
          node --check osc-priority-bridge.mjs
          node --check live-activity.mjs
          node --check routine-trace.mjs
          node --check performance-engine.mjs
          node --check performance-ui.mjs
          node --check learning.mjs
          node --check catalog-core.mjs
          node --check editor-assist.mjs
          node --check sound-designer-core.mjs
          node --check sound-designer.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          html=Path('index.html').read_text()
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          assert 'apple-mobile-web-app-capable' in html
          assert 'maximum-scale=1' in html
          assert 'apple-touch-icon.png' in html
          assert manifest['display']=='standalone'
          assert Path('app-icon.svg').exists()
          PY
          node qa/learning-test.mjs
          node qa/catalog-test.mjs
          node qa/sound-designer-test.mjs
          node qa/performance-test.mjs
          node qa/live-activity-test.mjs
          node qa/osc-priority-test.mjs
