name: Check SuperCollision IDE
on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/check-ide.yml']
  pull_request:
    paths: ['index.html', '.github/workflows/check-ide.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax and essential controls
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.scripts=[]; self.capture=False; self.current=''
              def handle_starttag(self,tag,attrs):
                  if tag=='script': self.capture=True; self.current=''
              def handle_data(self,data):
                  if self.capture:self.current+=data
              def handle_endtag(self,tag):
                  if tag=='script' and self.capture:self.scripts.append(self.current);self.capture=False
          html=Path('index.html').read_text()
          p=Scripts();p.feed(html)
          assert len(p.scripts)==2
          for i,script in enumerate(p.scripts):
              Path(f'/tmp/supercollision-{i}.mjs').write_text(script)
          for key in ('id="evaluate"','id="panic"','id="projects"','id="console"','id="engine"'):
              assert key in html,key
          PY
          node --check /tmp/supercollision-0.mjs
          node --check /tmp/supercollision-1.mjs
