name: Bundle offline theme typography
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bundle-theme-fonts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch licensed Latin fonts and verify formats
        run: |
          python3 -m pip install --quiet fonttools brotli
          python3 - <<'PY'
          import pathlib, re, urllib.request
          families=[('Oxanium','oxanium',800),('Josefin Sans','josefin-sans',700),('Libre Franklin','libre-franklin',800),('Megrim','megrim',400),('Plaster','plaster',400)]
          dest=pathlib.Path('assets/fonts')
          dest.mkdir(parents=True,exist_ok=True)
          for family,slug,max_weight in families:
              query=family.replace(' ','+')
              weight_spec='400' if max_weight==400 else f'400..{max_weight}'
              url=f'https://fonts.googleapis.com/css2?family={query}:wght@{weight_spec}&display=swap'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/120.0.0.0 Safari/537.36'})
              css=urllib.request.urlopen(req,timeout=25).read().decode()
              blocks=re.findall(r'@font-face\s*\{([^}]+)\}',css,re.S)
              if not blocks: raise RuntimeError('Missing Latin font face: '+family)
              urls=re.findall(r'url\((https://[^)]+)\)',blocks[-1])
              if not urls: raise RuntimeError('Missing font URL: '+family)
              data=urllib.request.urlopen(urls[-1],timeout=25).read()
              if data.startswith(b'wOF2'):
                  converted=data
              elif data.startswith((b'\x00\x01\x00\x00',b'OTTO')):
                  from fontTools.ttLib import TTFont
                  import io
                  font=TTFont(io.BytesIO(data))
                  font.flavor='woff2'
                  buffer=io.BytesIO()
                  font.save(buffer)
                  converted=buffer.getvalue()
              else: raise RuntimeError('Unrecognized font format: '+family+' '+repr(data[:8]))
              if not converted.startswith(b'wOF2'):raise RuntimeError('WOFF2 conversion failed: '+family)
              (dest/(slug+'.woff2')).write_bytes(converted)
              license_url='https://raw.githubusercontent.com/google/fonts/main/ofl/'+slug.replace('-','')+'/OFL.txt'
              license_data=urllib.request.urlopen(license_url,timeout=25).read()
              if b'SIL OPEN FONT LICENSE' not in license_data.upper():raise RuntimeError('Invalid license '+family)
              (dest/(slug+'-OFL.txt')).write_bytes(license_data)
              print(f'{family}: {len(data)} bytes, licensed')
          PY
          # Experimental angular display face: original OFL Newell typeface.
          python3 - <<'PY'
          import pathlib, urllib.request
          base='https://raw.githubusercontent.com/JordanNewell/newell-typeface/master/'
          dest=pathlib.Path('assets/fonts')
          for filename,target in [('releases/Newell-Regular.woff2','newell.woff2'),('OFL.txt','newell-OFL.txt')]:
              try:
                  data=urllib.request.urlopen(base+filename,timeout=25).read()
              except Exception as error:
                  print('Newell optional fetch unavailable:',error)
                  break
              if filename.endswith('.woff2') and not data.startswith(b'wOF2'):
                  raise RuntimeError('Invalid Newell font')
              (dest/target).write_bytes(data)
          PY
      - name: Bundle licensed Outpost Mono control face
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          dest=pathlib.Path('assets/fonts')
          base='https://raw.githubusercontent.com/ursooperduper/outpost-mono/main/'
          for source,target in [
              ('fonts/webfonts/OutpostMono-Regular.woff2','outpost-mono.woff2'),
              ('OFL.txt','outpost-mono-OFL.txt')
          ]:
              data=urllib.request.urlopen(base+source,timeout=30).read()
              if target.endswith('.woff2') and not data.startswith(b'wOF2'):
                  raise RuntimeError('Outpost Mono font signature invalid')
              if target.endswith('.txt') and b'SIL OPEN FONT LICENSE' not in data.upper():
                  raise RuntimeError('Outpost Mono license invalid')
              (dest/target).write_bytes(data)
          PY
      - name: Commit offline fonts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle licensed theme display fonts for offline use'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
