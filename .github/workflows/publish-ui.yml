name: Publish UI to Cloudflare Pages branch
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.mjs'
      - '*.json'
      - '*.webmanifest'
      - '*.svg'
      - '_headers'
      - 'assets/fonts/**'
      - 'scripts/build_language_catalog.py'
      - 'supercollision-header.css'
      - 'scripts/stage_sounds_release.py'
      - 'scripts/build_offline_manifest.py'
      - 'scripts/render_icons.py'
      - 'qa/lab-offline-browser-test.mjs'
      - 'qa/offline-policy-test.mjs'
      - 'qa/release-version-test.mjs'
      - '.github/workflows/publish-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: supercollision-pages-publish
  # The Sounds publisher shares this lane and must never be cancelled mid-release.
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout production branch with compiled WebAssembly engine
        uses: actions/checkout@v4
        with:
          ref: pages-build
          path: site
          persist-credentials: true
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Checkout official SuperCollider class documentation
        uses: actions/checkout@v4
        with:
          repository: supercollider/supercollider
          ref: develop
          path: upstream-help
          persist-credentials: false
          sparse-checkout: HelpSource/Classes
      - name: Assemble production frontend without rebuilding or deleting audio engine
        run: |
          set -euo pipefail
          python3 source/scripts/verify_runtime.py site/runtime
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          source, target = Path("source"), Path("site")
          names = [
              "index.html", "_headers",
              "instrument-layout.css", "instrument-layout.js", "live-activity.mjs",
              "routine-trace.mjs", "performance-engine.mjs", "performance-ui.mjs", "mix-explain.mjs",
              "performance.css", "learning.mjs", "learning.css", "catalog-core.mjs",
              "editor-assist.mjs", "code-selection.mjs", "error-guide.mjs", "repair-ui.mjs", "repair-ui.css",
              "catalog-assist.css", "osc-priority-bridge.mjs",
              "sound-designer.mjs", "sound-designer-core.mjs", "sound-designer.css",
              "lab-offline.mjs", "lab-sw.js", "lab-composition-vault.mjs",
              "offline-cache-policy.mjs", "manifest.webmanifest", "app-icon.svg",
          ]
          for name in names:
              copy2(source / name, target / name)
          from shutil import copytree
          if (source / "assets/fonts").is_dir():
              copytree(source / "assets/fonts", target / "assets/fonts", dirs_exist_ok=True)
          PY
          python3 source/scripts/build_language_catalog.py upstream-help/HelpSource/Classes site/language-catalog.json
          python3 -m pip install --quiet --break-system-packages cairosvg
          python3 source/scripts/render_icons.py
          cp source/apple-touch-icon.png source/app-icon-192.png source/app-icon-512.png site/
          python3 source/scripts/build_offline_manifest.py site
          # When Code and Sounds are updated together, either publishing lane
          # must release the same complete site, never new Code with old Sounds.
          if [ -f source/scripts/stage_sounds_release.py ]; then
            python3 source/scripts/stage_sounds_release.py source site
          fi
      - name: Verify production content and explicit download policy
        run: |
          set -euo pipefail
          node --check source/lab-sw.js
          node --check source/lab-offline.mjs
          node --check source/lab-composition-vault.mjs
          node --check source/code-selection.mjs
          node source/qa/code-selection-test.mjs
          node source/qa/release-version-test.mjs
          node source/qa/sounds-bench-links-test.mjs
          node --check source/instrument-layout.js
          node --check source/live-activity.mjs
          node --check source/performance-engine.mjs
          node --check source/performance-ui.mjs
          node --check source/mix-explain.mjs
          node --check source/qa/lab-offline-browser-test.mjs
          node source/qa/offline-policy-test.mjs
          node source/qa/performance-test.mjs
          node source/qa/mix-explain-test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          site = Path("site")
          manifest = json.loads((site / "lab-offline-assets.json").read_text())
          paths = {f["path"] for f in manifest["files"]}
          assert manifest["format"] == "supercollision-offline-v1"
          assert "/index.html" in paths and "/lab-sw.js" in paths
          assert "/runtime/sclang/sclang.wasm" in paths
          assert "/runtime/scsynth/scsynth.wasm" in paths
          for font in ("oxanium", "josefin-sans", "libre-franklin", "megrim", "plaster", "outpost-mono"):
              asset = f"/assets/fonts/{font}.woff2"
              assert asset in paths, f"Missing offline display font: {asset}"
              assert (site / asset.lstrip("/")).read_bytes()[:4] == b"wOF2"
          for item in manifest["files"]:
              p = site / item["path"].lstrip("/")
              assert p.is_file() and p.stat().st_size == item["bytes"]
          page = (site / "index.html").read_text()
          assert "<title>SuperCollision |" in page
          assert 'src="./code-selection.mjs?v=1"' in page
          assert (site / 'code-selection.mjs').is_file()
          assert 'id="workspace-divider"' in page
          assert 'id="live-panel-resizer"' in page
          assert "location.assign('./sounds-bench-preview.html#play')" in page
          assert 'sounds-overlay' not in page
          assert (site / "sounds.html").is_file()
          assert (site / "librivox-explorer.html").is_file()
          assert (site / "sound-surfaces-design.css").is_file()
          assert (site / "sound-surfaces-theme.mjs").is_file()
          assert 'src="./lab-offline.mjs"' in page
          assert json.loads((site / "manifest.webmanifest").read_text())["name"] == "SuperCollision"
          PY
      - name: Browser-test complete production site before publishing
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node source/qa/lab-offline-browser-test.mjs
          node source/qa/code-selection-browser-test.mjs
          node source/qa/header-navigation-browser-test.mjs
          SC_QA_SITE_DIR=site node source/qa/header-navigation-browser-test.mjs
          node source/qa/mix-explain-browser-test.mjs
      - name: Commit tested production site to Pages branch
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/ index.html _headers instrument-layout.css instrument-layout.js code-selection.mjs live-activity.mjs routine-trace.mjs performance-engine.mjs performance-ui.mjs mix-explain.mjs performance.css learning.mjs learning.css catalog-core.mjs editor-assist.mjs error-guide.mjs repair-ui.mjs repair-ui.css catalog-assist.css osc-priority-bridge.mjs sound-designer.mjs sound-designer-core.mjs sound-designer.css lab-offline.mjs lab-sw.js lab-composition-vault.mjs offline-cache-policy.mjs language-catalog.json manifest.webmanifest app-icon.svg apple-touch-icon.png app-icon-192.png app-icon-512.png lab-offline-assets.json
          git add sounds.html sounds-lab.html sounds-bench-preview.html sounds-workspace.css sounds-reach.css sound-surfaces-design.css sound-surfaces-theme.mjs supercollision-header.css sounds-*.mjs librivox-explorer.html librivox-explorer.css librivox-*.mjs
          if git diff --cached --quiet; then
            echo "Production site is already current"
          else
            git commit -m "Publish tested offline SuperCollision frontend"
            # Sounds publishes to this same branch independently. Never force-push
            # or overwrite its files when it wins a concurrent publication race.
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:pages-build; then
                echo "UI published without discarding concurrent Sounds changes."
                exit 0
              fi
              echo "Production advanced during UI publishing; rebasing UI-only commit (attempt $attempt)."
              git fetch --no-tags --depth=50 origin pages-build
              git rebase origin/pages-build
            done
            echo "Could not publish after five safe non-force retries."
            exit 1
          fi
