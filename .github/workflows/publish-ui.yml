name: Publish UI to Cloudflare Pages branch
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'osc-priority-bridge.mjs'
      - 'instrument-layout.css'
      - 'instrument-layout.js'
      - 'live-activity.mjs'
      - 'routine-trace.mjs'
      - 'performance-engine.mjs'
      - 'performance-ui.mjs'
      - 'performance.css'
      - 'learning.mjs'
      - 'learning.css'
      - 'catalog-core.mjs'
      - 'editor-assist.mjs'
      - 'error-guide.mjs'
      - 'catalog-assist.css'
      - 'sound-designer.mjs'
      - 'sound-designer-core.mjs'
      - 'sound-designer.css'
      - 'scripts/build_language_catalog.py'
      - 'app-icon.svg'
      - 'manifest.webmanifest'
      - 'scripts/render_icons.py'
      - '_headers'
      - '.github/workflows/publish-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: supercollision-pages-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch with compiled WASM runtime
        uses: actions/checkout@v4
        with:
          ref: pages-build
          path: site
          persist-credentials: true
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Checkout official SuperCollider class documentation
        uses: actions/checkout@v4
        with:
          repository: supercollider/supercollider
          ref: develop
          path: upstream-help
          persist-credentials: false
          sparse-checkout: HelpSource/Classes
      - name: Update frontend without rebuilding or deleting WASM
        run: |
          set -euo pipefail
          test -f site/runtime/sclang/sclang.js
          test -f site/runtime/scsynth/scsynth.js
          cp source/index.html site/index.html
          cp source/instrument-layout.css site/instrument-layout.css
          cp source/instrument-layout.js site/instrument-layout.js
          cp source/live-activity.mjs site/live-activity.mjs
          cp source/routine-trace.mjs site/routine-trace.mjs
          cp source/performance-engine.mjs site/performance-engine.mjs
          cp source/performance-ui.mjs site/performance-ui.mjs
          cp source/performance.css site/performance.css
          cp source/learning.mjs source/learning.css source/catalog-core.mjs source/editor-assist.mjs source/error-guide.mjs source/catalog-assist.css source/osc-priority-bridge.mjs source/sound-designer.mjs source/sound-designer-core.mjs source/sound-designer.css site/
          python3 source/scripts/build_language_catalog.py upstream-help/HelpSource/Classes site/language-catalog.json
          cp source/app-icon.svg source/manifest.webmanifest site/
          python3 -m pip install --quiet --break-system-packages cairosvg
          python3 source/scripts/render_icons.py
          cp source/apple-touch-icon.png source/app-icon-192.png source/app-icon-512.png site/
          cp source/_headers site/_headers
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _headers instrument-layout.css instrument-layout.js live-activity.mjs routine-trace.mjs performance-engine.mjs performance-ui.mjs performance.css learning.mjs learning.css catalog-core.mjs editor-assist.mjs error-guide.mjs catalog-assist.css osc-priority-bridge.mjs sound-designer.mjs sound-designer-core.mjs sound-designer.css language-catalog.json app-icon.svg manifest.webmanifest apple-touch-icon.png app-icon-192.png app-icon-512.png
          if git diff --cached --quiet; then
            echo "Already current"
          else
            git commit -m "Publish latest SuperCollision frontend"
            git push origin HEAD:pages-build
          fi
