name: Prepare SuperCollision WebAssembly site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/prepare-site.yml'
      - '_headers'
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download most recent successful upstream SuperCollider WASM artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_wasm.py
      - name: Package static site
        run: |
          mkdir -p dist
          cp index.html _headers dist/
          cp -R runtime dist/
          python3 scripts/verify_runtime.py dist/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: supercollision-static-site
          path: dist/
