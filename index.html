eight:180px;overflow:auto;background:#0d131c;border:1px solid #45566b;border-radius:9px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}#syntax-preview .str{color:#e6c98a}#syntax-preview .comment{color:#7fb396}#syntax-preview .class{color:#9cc5ff}#syntax-preview .num{color:#d8b2f4}@media(min-width:700px){#code{min-height:48vh}} /* SuperCollision 0.4: instrument-panel visual system */

<header><h1>SuperCollision</h1><small>INSTRUMENT / 0.4</small></header>
<main>
<div class="panel">
<div class="projectbar"><select id="projects" aria-label="Saved compositions"></select><details class="menu"><summary aria-label="Composition actions">FILE ▾</summary><div class="menu-items"><button id="new-project" class="secondary">New</button><button id="rename-project" class="secondary">Rename</button><button id="delete-project" class="secondary">Delete</button><button id="import-file" class="secondary">Import .scd</button><button id="export-file" class="secondary">Export .scd</button><button id="copy" class="secondary">Copy code</button><button id="clear" class="secondary">Load example</button></div></details></div>

<div class="toolbar"><button id="evaluate" disabled>▶ RUN</button><button id="panic" class="secondary" disabled>■ STOP</button><button id="engine" class="secondary">POWER</button><span id="save-status" class="muted" role="status">Saved</span></div>
<textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="SuperCollider code editor"></textarea>

<input id="file-input" type="file" hidden>
<details class="utility"><summary>Syntax view</summary><pre id="syntax-preview" aria-label="Syntax-highlighted code preview"></pre><p class="muted">Read-only preview. Edit in the code area above.</p></details>
</div>
<div class="panel console-shell"><p id="engine-status" role="status">Engine off · Press POWER</p>
<details id="console-panel"><summary>SuperCollider console</summary><div class="actions"><button id="clear-console" class="secondary">Clear console</button></div><pre id="console" aria-live="off"></pre></details></div>
<details class="panel utility"><summary>Audio diagnostic</summary><p class="muted">Independent Web Audio test, not SuperCollider.</p><div class="actions"><button id="play" class="secondary">Test tone</button><button id="stop" class="secondary">Stop test tone</button></div><p id="status" role="status">Ready.</p><small id="info"></small></details>
</main>
<script>
const example='(\n{ SinOsc.ar(440, 0, 0.15) ! 2 }.play;\n)';
const code=document.querySelector('#code'),status=document.querySelector('#status'),projectsEl=document.querySelector('#projects'),saveStatus=document.querySelector('#save-status');
const KEY='supercollision-projects-v1',ACTIVE='supercollision-active-v1';
let projects={},active='Default',saveTimer;
try{projects=JSON.parse(localStorage.getItem(KEY)||'{}');if(!projects||typeof projects!=='object'||Array.isArray(projects))projects={}}catch{projects={}}
if(!Object.keys(projects).length){let old;try{old=localStorage.getItem('supercollision-code')}catch{}projects.Default=old||example}
try{active=localStorage.getItem(ACTIVE)||'Default'}catch{}
if(!Object.hasOwn(projects,active))active=Object.keys(projects)[0];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(projects));localStorage.setItem(ACTIVE,active);saveStatus.textContent='SAVED'}catch(e){saveStatus.textContent='SAVE ERROR'}}
function renderProjects(){projectsEl.replaceChildren();for(const name of Object.keys(projects)){const option=document.createElement('option');option.value=name;option.textContent=name;projectsEl.append(option)}projectsEl.value=active;code.value=projects[active]||'';updatePreview();persist()}
function commit(){projects[active]=code.value;persist()}
code.addEventListener('input',()=>{saveStatus.textContent='SAVING';updatePreview();clearTimeout(saveTimer);saveTimer=setTimeout(commit,200)});
function flush(){clearTimeout(saveTimer);commit()}
projectsEl.onchange=()=>{const next=projectsEl.value;flush();active=next;renderProjects()};
function uniqueName(name){let n=name,i=2;while(Object.hasOwn(projects,n))n=name+' '+i++;return n}
document.querySelector('#new-project').onclick=()=>{flush();const name=prompt('New composition name','Untitled');if(!name?.trim())return;active=uniqueName(name.trim().slice(0,80));projects[active]='';renderProjects()};
document.querySelector('#rename-project').onclick=()=>{flush();const name=prompt('Rename composition',active)?.trim().slice(0,80);if(!name||name===active)return;if(Object.hasOwn(projects,name)){alert('That name is already in use.');return}projects[name]=projects[active];delete projects[active];active=name;renderProjects()};
document.querySelector('#delete-project').onclick=()=>{if(!confirm('Delete composition "'+active+'"? This cannot be undone.'))return;delete projects[active];if(!Object.keys(projects).length)projects.Default=example;active=Object.keys(projects)[0];renderProjects()};
const preview=document.querySelector('#syntax-preview');
function updatePreview(){const text=code.value;preview.replaceChildren();const re=/(\/\/[^\n]*|"(?:\\.|[^"\\])*"|\b[A-Z][A-Za-z0-9_]*\b|\b\d+(?:\.\d+)?\b)/g;let last=0,m;while((m=re.exec(text))){preview.append(document.createTextNode(text.slice(last,m.index)));const span=document.createElement('span');span.className=m[0].startsWith('//')?'comment':m[0].startsWith('"')?'str':/^\d/.test(m[0])?'num':'class';span.textContent=m[0];preview.append(span);last=re.lastIndex}preview.append(document.createTextNode(text.slice(last)))}
let ctx,osc,gain;
function report(t){status.textContent=t}
async function stop(){if(osc){try{osc.stop()}catch{}osc.disconnect();osc=null}if(gain){gain.disconnect();gain=null}report('Audio test stopped.')}
document.querySelector('#play').onclick=async()=>{try{if(osc)await stop();const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('Web Audio unavailable');ctx=ctx||new C();await ctx.resume();osc=ctx.createOscillator();gain=ctx.createGain();osc.frequency.value=440;gain.gain.value=.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();report('Playing 440 Hz Web Audio diagnostic.')}catch(e){report('Audio test failed: '+e.message)}};
document.querySelector('#stop').onclick=stop;
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(code.value);report('Code copied.')}catch(e){report('Copy unavailable: '+e.message)}};
document.querySelector('#import-file').onclick=()=>document.querySelector('#file-input').click();
document.querySelector('#file-input').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('File exceeds 2 MB');if(!/\.(scd|sc|txt)$/i.test(file.name))throw Error('Choose a .scd, .sc, or .txt file');flush();active=uniqueName(file.name.replace(/\.(scd|sc|txt)$/i,'').slice(0,80)||'Imported');projects[active]=await file.text();renderProjects();report('Imported '+file.name)}catch(err){report('Import failed: '+err.message)}e.target.value=''};
document.querySelector('#export-file').onclick=()=>{flush();const blob=new Blob([code.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=active.replace(/[^a-z0-9_-]/gi,'_')+'.scd';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)};
document.querySelector('#clear').onclick=()=>{if(code.value&&!confirm('Replace current composition with the example?'))return;code.value=example;code.dispatchEvent(new Event('input'))};
document.querySelector('#info').textContent='Platform: '+navigator.platform+' | Secure context: '+window.isSecureContext;
renderProjects();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
</script>
<script type="module">
let lang,synth;
const state=document.querySelector('#engine-status'),log=document.querySelector('#console'),run=document.querySelector('#evaluate'),panic=document.querySelector('#panic');
function message(t){state.textContent=t}
function print(t){log.textContent+=(String(t)+'\n');if(log.textContent.length>120000)log.textContent=log.textContent.slice(-80000);log.scrollTop=log.scrollHeight}
document.querySelector('#clear-console').onclick=()=>{log.textContent=''};
let booting=false;
document.querySelector('#engine').onclick=async()=>{
 if(lang){message('SuperCollider engine already loaded.');return}
 if(booting)return;
 booting=true;document.querySelector('#engine').disabled=true;
 message('Checking runtime assets...');
 try{
  const base=new URL('./runtime/',location.href);
  for(const name of ['sclang/sclang.js','scsynth/scsynth.js']){
   const res=await fetch(new URL(name,base),{method:'HEAD',cache:'no-store'});
   if(!res.ok)throw Error(name+' missing (HTTP '+res.status+')');
  }
  if(!crossOriginIsolated)throw Error('Cross-origin isolation is unavailable. SuperCollider WebAssembly threading requires COOP/COEP headers; ordinary GitHub Pages does not supply them.');
  message('Loading real SuperCollider modules...');
  const [{default:ScLang},{default:ScSynth}]=await Promise.all([import('./runtime/sclang/sclang.js'),import('./runtime/scsynth/scsynth.js')]);
  lang=await ScLang({locateFile:p=>new URL(p,new URL('sclang/',base)).href});
  synth=await ScSynth({locateFile:p=>new URL(p,new URL('scsynth/',base)).href});
  lang.printCallback=print;synth.onStdout=print;
  lang.onOsc=osc=>synth.sendOsc(new Uint8Array(osc));
  synth.onOscReply=osc=>lang.sendOsc(osc);
  lang.bootInterpreter();
  window.bootServer=options=>{if(options.numOutputBusChannels)setTimeout(async()=>{try{await synth.boot(options)}catch(e){print('Server boot: '+e.message)}},100)};
  run.disabled=false;panic.disabled=false;
  message('ENGINE READY · RUN to evaluate');
 }catch(e){message('Runtime unavailable: '+e.message);print(e.stack||e.message)}finally{booting=false;document.querySelector('#engine').disabled=false}
};
run.onclick=()=>{if(!lang)return;try{const source=document.querySelector('#code').value;flush();lang.runCode(source);message('Code sent to SuperCollider interpreter. Check console for results.')}catch(e){message('Evaluation failed: '+e.message)}};
panic.onclick=()=>{if(!lang)return;try{lang.runCode('CmdPeriod.run;');message('STOP SENT · ENGINE READY')}catch(e){message('Stop failed: '+e.message)}};

</script></html>
