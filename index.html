eight:180px;overflow:auto;background:#0d131c;border:1px solid #45566b;border-radius:9px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}#syntax-preview .str{color:#e6c98a}#syntax-preview .comment{color:#7fb396}#syntax-preview .class{color:#9cc5ff}#syntax-preview .num{color:#d8b2f4}@media(min-width:700px){#code{min-height:48vh}} /* SuperCollision 0.4: instrument-panel visual system */

.editor-frame{display:flex;min-width:0;background:#1b1e1c}#line-gutter{flex:0 0 32px;overflow:hidden;white-space:pre;text-align:right;padding:12px 5px 12px 0;color:#858b7f;background:#252825;border-right:1px solid #444;font:10px/21.28px ui-monospace,monospace;user-select:none}#code{flex:1;min-width:0;line-height:21.28px;white-space:pre;overflow-wrap:normal;overflow-x:auto}.toolbar{flex-wrap:wrap}#record{color:#edb2a5;border-color:#ad7062}@media(max-width:390px){#line-gutter{flex-basis:27px}.toolbar button{min-width:51px}}.composition-picker{position:relative;flex:1;min-width:0}.composition-picker>button{width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#242725;border:1px solid #55594f;color:#e6e4db;font-size:14px}.project-list{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:15;max-height:55dvh;overflow:auto;background:#252925;border:1px solid #85877d;box-shadow:0 12px 30px #000b}.project-list[hidden]{display:none}.project-entry{position:relative;overflow:hidden;border-bottom:1px solid #484c44;touch-action:pan-y}.project-entry button.pick{display:block;width:100%;text-align:left;background:#252925;color:#e9e7dc;border:0;border-radius:0;min-height:46px;font-weight:500;letter-spacing:0;transition:transform .15s ease;position:relative;z-index:1}.project-entry.reveal button.pick{transform:translateX(-83px)}.project-entry button.remove{position:absolute;right:0;top:0;height:100%;width:83px;border-radius:0;background:#914e44;color:white}.project-entry.selected button.pick{color:#e9c57a}.project-entry button.pick:focus-visible{outline:2px solid #e9c57a;outline-offset:-2px}#line-gutter .line{display:block;height:21.28px}#line-gutter .line.active{background:#655032;color:#f4d58b;font-weight:700}#project-search{width:100%;border:0;border-bottom:1px solid #777;background:#242725}#engine-status.error{color:#f3a394}</style>
<header><h1>SuperCollision</h1><small>INSTRUMENT / 0.7</small></header>
<main>
<div class="panel">
<div class="projectbar"><div class="composition-picker"><button id="project-toggle" type="button" class="secondary" aria-expanded="false" aria-controls="project-list">Composition ▾</button><div id="project-list" class="project-list" hidden role="listbox" aria-label="Saved compositions"></div></div><select id="projects" aria-label="Saved compositions" hidden></select><details class="menu"><summary aria-label="Composition actions">FILE ▾</summary><div class="menu-items"><button id="new-project" class="secondary">New</button><button id="rename-project" class="secondary">Rename</button><button id="delete-project" class="secondary">Delete</button><button id="import-file" class="secondary">Import .scd</button><button id="export-file" class="secondary">Export .scd</button><button id="copy" class="secondary">Copy code</button><button id="clear" class="secondary">Load example</button><button id="backup-projects" class="secondary">Backup all</button><button id="restore-projects" class="secondary">Restore backup</button><button id="storage-info" class="secondary">Storage / cleanup</button><button id="go-line" class="secondary">Go to line</button><button id="undo-delete" class="secondary" disabled>Undo delete</button></div></details></div>

<div class="toolbar"><button id="evaluate" disabled>▶ RUN</button><button id="run-region" class="secondary" disabled>PART</button><button id="panic" class="secondary" disabled>■ STOP</button><button id="engine" class="secondary">POWER</button><button id="record" class="secondary" disabled>● REC</button><button id="record-stop" class="secondary" disabled>■ SAVE</button><span id="save-status" class="muted" role="status">Saved</span></div>
<div class="editor-frame"><div id="line-gutter" aria-hidden="true">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="SuperCollider code editor"></textarea></div>

<input id="file-input" type="file" hidden><input id="backup-input" type="file" hidden>
<details class="utility"><summary>Syntax view</summary><pre id="syntax-preview" aria-label="Syntax-highlighted code preview"></pre><p class="muted">Read-only preview. Edit in the code area above.</p></details>
</div>
<div class="panel console-shell"><p id="engine-status" role="status">Engine off · Press POWER</p>
<details id="console-panel"><summary>SuperCollider console</summary><div class="actions"><button id="clear-console" class="secondary">Clear console</button></div><pre id="console" aria-live="off"></pre></details></div>
<details class="panel utility"><summary>Audio diagnostic</summary><p class="muted">Independent Web Audio test, not SuperCollider.</p><div class="actions"><button id="play" class="secondary">Test tone</button><button id="stop" class="secondary">Stop test tone</button></div><p id="status" role="status">Ready.</p><small id="info"></small></details>
</main>
<script>
const example='(\n{ SinOsc.ar(440, 0, 0.15) ! 2 }.play;\n)';
const code=document.querySelector('#code'),status=document.querySelector('#status'),projectsEl=document.querySelector('#projects'),saveStatus=document.querySelector('#save-status');
const KEY='supercollision-projects-v1',ACTIVE='supercollision-active-v1';
let projects={},active='Default',saveTimer,activeRegion=null;
try{projects=JSON.parse(localStorage.getItem(KEY)||'{}');if(!projects||typeof projects!=='object'||Array.isArray(projects))projects={}}catch{projects={}}
if(!Object.keys(projects).length){let old;try{old=localStorage.getItem('supercollision-code')}catch{}projects.Default=old||example}
try{active=localStorage.getItem(ACTIVE)||'Default'}catch{}
if(!Object.hasOwn(projects,active))active=Object.keys(projects)[0];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(projects));localStorage.setItem(ACTIVE,active);saveStatus.textContent='SAVED'}catch(e){saveStatus.textContent='SAVE ERROR'}}
function renderProjects(){projectsEl.replaceChildren();for(const name of Object.keys(projects)){const option=document.createElement('option');option.value=name;option.textContent=name;projectsEl.append(option)}projectsEl.value=active;code.value=projects[active]||'';updatePreview();persist();renderPicker()}
function commit(){projects[active]=code.value;persist()}
const toggle=document.querySelector('#project-toggle'),list=document.querySelector('#project-list');
let recentlyDeleted=null;const undoDelete=document.querySelector('#undo-delete');
function deleteComposition(name){if(!confirm('Delete "'+name+'"? Undo available until reload.'))return;flush();recentlyDeleted={name,code:projects[name]};undoDelete.disabled=false;delete projects[name];if(!Object.keys(projects).length)projects.Default=example;if(active===name)active=Object.keys(projects)[0];renderProjects();closePicker()}
undoDelete.onclick=()=>{if(!recentlyDeleted)return;const d=recentlyDeleted;recentlyDeleted=null;undoDelete.disabled=true;active=uniqueName(d.name);projects[active]=d.code;renderProjects()};
function closePicker(){list.hidden=true;toggle.setAttribute('aria-expanded','false')}
toggle.onclick=()=>{const opening=list.hidden;list.hidden=!opening;toggle.setAttribute('aria-expanded',String(opening));if(opening)renderPicker()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.composition-picker'))closePicker()});
function renderPicker(){toggle.textContent=active+'  ▾';list.replaceChildren();const search=document.createElement('input');search.id='project-search';search.placeholder='Find composition';list.append(search);for(const name of Object.keys(projects)){const entry=document.createElement('div');entry.className='project-entry'+(name===active?' selected':'');entry.setAttribute('role','option');entry.setAttribute('aria-selected',String(name===active));const pick=document.createElement('button');pick.type='button';pick.className='pick';pick.textContent=name;pick.onclick=()=>{flush();active=name;renderProjects();closePicker()};const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='Delete';remove.onclick=()=>deleteComposition(name);entry.append(pick,remove);let startX=0,startY=0;entry.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});entry.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3){entry.classList.toggle('reveal',dx<0)}},{passive:true});list.append(entry)}search.oninput=()=>{const q=search.value.toLowerCase();for(const row of list.querySelectorAll('.project-entry'))row.hidden=!row.querySelector('.pick').textContent.toLowerCase().includes(q)}}

code.addEventListener('input',()=>{saveStatus.textContent='SAVING';updatePreview();clearTimeout(saveTimer);saveTimer=setTimeout(commit,200)});
function flush(){clearTimeout(saveTimer);commit()}
projectsEl.onchange=()=>{const next=projectsEl.value;flush();active=next;renderProjects()};
function uniqueName(name){let n=name,i=2;while(Object.hasOwn(projects,n))n=name+' '+i++;return n}
document.querySelector('#new-project').onclick=()=>{flush();const name=prompt('New composition name','Untitled');if(!name?.trim())return;active=uniqueName(name.trim().slice(0,80));projects[active]='';renderProjects()};
document.querySelector('#rename-project').onclick=()=>{flush();const name=prompt('Rename composition',active)?.trim().slice(0,80);if(!name||name===active)return;if(Object.hasOwn(projects,name)){alert('That name is already in use.');return}projects[name]=projects[active];delete projects[active];active=name;renderProjects()};
document.querySelector('#delete-project').onclick=()=>deleteComposition(active);
document.querySelector('#go-line').onclick=()=>{const n=Number(prompt('Go to line (1–'+code.value.split('\n').length+')'));if(!Number.isInteger(n)||n<1)return;const lines=code.value.split('\n');const pos=lines.slice(0,n-1).reduce((a,v)=>a+v.length+1,0);code.focus();code.setSelectionRange(Math.min(pos,code.value.length),Math.min(pos,code.value.length));const lineHeight=parseFloat(getComputedStyle(code).lineHeight)||21.28;code.scrollTop=Math.max(0,(n-3)*lineHeight)};
const gutter=document.querySelector('#line-gutter');const preview=document.querySelector('#syntax-preview');
function updatePreview(){updateLines();const text=code.value;preview.replaceChildren();const re=/(\/\/[^\n]*|"(?:\\.|[^"\\])*"|\b[A-Z][A-Za-z0-9_]*\b|\b\d+(?:\.\d+)?\b)/g;let last=0,m;while((m=re.exec(text))){preview.append(document.createTextNode(text.slice(last,m.index)));const span=document.createElement('span');span.className=m[0].startsWith('//')?'comment':m[0].startsWith('"')?'str':/^\d/.test(m[0])?'num':'class';span.textContent=m[0];preview.append(span);last=re.lastIndex}preview.append(document.createTextNode(text.slice(last)))}
function updateLines(){const n=code.value.split('\n').length;gutter.replaceChildren();const frag=document.createDocumentFragment();for(let i=1;i<=n;i++){const line=document.createElement('span');line.className='line'+(activeRegion&&i>=activeRegion.start&&i<=activeRegion.end?' active':'');line.textContent=i;frag.append(line)}gutter.append(frag);gutter.scrollTop=code.scrollTop}code.addEventListener('scroll',()=>{gutter.scrollTop=code.scrollTop});
document.querySelector('#storage-info').onclick=()=>{flush();const bytes=new Blob([JSON.stringify(projects)]).size;const count=Object.keys(projects).length;if(prompt(count+' compositions, '+(bytes/1024).toFixed(1)+' KiB. Type DELETE ALL to erase (backup first).')!=='DELETE ALL')return;if(!confirm('Delete all compositions permanently?'))return;projects={Default:example};active='Default';renderProjects()};
function downloadText(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
document.querySelector('#backup-projects').onclick=()=>{flush();downloadText('SuperCollision-backup.json',JSON.stringify({format:'supercollision-projects-v1',projects},null,2),'application/json')};
document.querySelector('#restore-projects').onclick=()=>document.querySelector('#backup-input').click();
document.querySelector('#backup-input').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>4000000)throw Error('Backup too large');const obj=JSON.parse(await file.text());if(obj.format!=='supercollision-projects-v1'||!obj.projects||Array.isArray(obj.projects)||typeof obj.projects!=='object')throw Error('Invalid backup');const entries=Object.entries(obj.projects);if(entries.length>1000||entries.some(([k,v])=>typeof k!=='string'||k.length>80||typeof v!=='string'))throw Error('Invalid composition data');flush();for(const [name,text] of entries)projects[uniqueName(name)]=text;renderProjects();report('Restored '+entries.length+' compositions')}catch(err){report('Restore failed: '+err.message)}e.target.value=''};
let ctx,osc,gain;
function report(t){status.textContent=t}
async function stop(){if(osc){try{osc.stop()}catch{}osc.disconnect();osc=null}if(gain){gain.disconnect();gain=null}report('Audio test stopped.')}
document.querySelector('#play').onclick=async()=>{try{if(osc)await stop();const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('Web Audio unavailable');ctx=ctx||new C();await ctx.resume();osc=ctx.createOscillator();gain=ctx.createGain();osc.frequency.value=440;gain.gain.value=.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();report('Playing 440 Hz Web Audio diagnostic.')}catch(e){report('Audio test failed: '+e.message)}};
document.querySelector('#stop').onclick=stop;
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(code.value);report('Code copied.')}catch(e){report('Copy unavailable: '+e.message)}};
document.querySelector('#import-file').onclick=()=>document.querySelector('#file-input').click();
document.querySelector('#file-input').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('File exceeds 2 MB');if(!/\.(scd|sc|txt)$/i.test(file.name))throw Error('Choose a .scd, .sc, or .txt file');flush();active=uniqueName(file.name.replace(/\.(scd|sc|txt)$/i,'').slice(0,80)||'Imported');projects[active]=await file.text();renderProjects();report('Imported '+file.name)}catch(err){report('Import failed: '+err.message)}e.target.value=''};
document.querySelector('#export-file').onclick=()=>{flush();const blob=new Blob([code.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=active.replace(/[^a-z0-9_-]/gi,'_')+'.scd';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)};
document.querySelector('#clear').onclick=()=>{if(code.value&&!confirm('Replace current composition with the example?'))return;code.value=example;code.dispatchEvent(new Event('input'))};
document.querySelector('#info').textContent='Platform: '+navigator.platform+' | Secure context: '+window.isSecureContext;
renderProjects();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
</script>
<script type="module">
let lang,synth;
const state=document.querySelector('#engine-status'),log=document.querySelector('#console'),run=document.querySelector('#evaluate'),panic=document.querySelector('#panic');
function message(t){state.textContent=t}
function print(t){if(/ERROR:|FAILURE|WARNING: Server/.test(String(t))){document.querySelector('#console-panel').open=true;state.classList.add('error')}log.textContent+=(String(t)+'\n');if(log.textContent.length>120000)log.textContent=log.textContent.slice(-80000);log.scrollTop=log.scrollHeight}
document.querySelector('#clear-console').onclick=()=>{log.textContent=''};
let booting=false;
document.querySelector('#engine').onclick=async()=>{
 if(lang){message('SuperCollider engine already loaded.');return}
 if(booting)return;
 booting=true;document.querySelector('#engine').disabled=true;
 message('Checking runtime assets...');
 try{
  const base=new URL('./runtime/',location.href);
  for(const name of ['sclang/sclang.js','scsynth/scsynth.js']){
   const res=await fetch(new URL(name,base),{method:'HEAD',cache:'no-store'});
   if(!res.ok)throw Error(name+' missing (HTTP '+res.status+')');
  }
  if(!crossOriginIsolated)throw Error('Cross-origin isolation is unavailable. SuperCollider WebAssembly threading requires COOP/COEP headers; ordinary GitHub Pages does not supply them.');
  message('Loading real SuperCollider modules...');
  const [{default:ScLang},{default:ScSynth}]=await Promise.all([import('./runtime/sclang/sclang.js'),import('./runtime/scsynth/scsynth.js')]);
  lang=await ScLang({locateFile:p=>new URL(p,new URL('sclang/',base)).href});
  synth=await ScSynth({locateFile:p=>new URL(p,new URL('scsynth/',base)).href});
  let serverBootRequested=false;
  lang.printCallback=t=>{print(t);if(!serverBootRequested&&String(t).includes('Welcome to SuperCollider')){serverBootRequested=true;message('LANGUAGE READY · Requesting audio server');lang.runCode('s.boot;')}};synth.onStdout=print;
  lang.onOsc=osc=>synth.sendOsc(new Uint8Array(osc));
  synth.onOscReply=osc=>lang.sendOsc(osc);
  lang.bootInterpreter();
  window.bootServer=options=>{if(options.numOutputBusChannels)setTimeout(async()=>{try{await synth.boot(options)}catch(e){print('Server boot: '+e.message)}},100)};
  run.disabled=false;panic.disabled=false;document.querySelector('#run-region').disabled=false;document.querySelector('#record').disabled=false;
  message('Initializing language; audio server will boot after startup');
 }catch(e){message('Runtime unavailable: '+e.message);print(e.stack||e.message)}finally{booting=false;document.querySelector('#engine').disabled=false}
};
function submitCode(source,start,end){if(!lang)return;try{flush();activeRegion={start,end};updateLines();state.classList.remove('error');lang.runCode(source);message('EVALUATED L'+start+'–'+end+' · source indication, not live audio tracing')}catch(e){message('Evaluation failed: '+e.message)}}
run.onclick=()=>submitCode(code.value,1,code.value.split('\n').length);
document.querySelector('#run-region').onclick=()=>{const a=code.selectionStart,b=code.selectionEnd,text=code.value;let from=a,to=b;if(a===b){from=text.lastIndexOf('\n',Math.max(0,a-1))+1;to=text.indexOf('\n',a);if(to<0)to=text.length}const source=text.slice(from,to);if(!source.trim())return;const start=text.slice(0,from).split('\n').length,end=start+source.split('\n').length-1;submitCode(source,start,end)};
panic.onclick=()=>{if(!lang)return;try{lang.runCode('CmdPeriod.run;');activeRegion=null;updateLines();message('STOP SENT · ENGINE READY')}catch(e){message('Stop failed: '+e.message)}};


let capture=null;
const recButton=document.querySelector('#record'),saveButton=document.querySelector('#record-stop');
function wavBlob(channels,sampleRate){const n=channels[0].length,c=channels.length,bytes=44+n*c*2,b=new ArrayBuffer(bytes),v=new DataView(b);let p=0;const str=t=>{for(const ch of t)v.setUint8(p++,ch.charCodeAt(0))};const u16=x=>{v.setUint16(p,x,true);p+=2},u32=x=>{v.setUint32(p,x,true);p+=4};str('RIFF');u32(bytes-8);str('WAVEfmt ');u32(16);u16(1);u16(c);u32(sampleRate);u32(sampleRate*c*2);u16(c*2);u16(16);str('data');u32(n*c*2);for(let i=0;i<n;i++)for(let k=0;k<c;k++){const x=Math.max(-1,Math.min(1,channels[k][i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([b],{type:'audio/wav'})}
recButton.onclick=async()=>{
 if(!synth||capture)return;
 try{
  const ac=synth.getAudioContext(),worklet=synth.getWorkletNode();
  if(!ac||!worklet)throw Error('Start SuperCollider audio before recording');
  await ac.resume();
  const dest=ac.createMediaStreamDestination();worklet.connect(dest);
  const input=ac.createMediaStreamSource(dest.stream),processor=ac.createScriptProcessor(2048,2,2),mute=ac.createGain();mute.gain.value=0;
  input.connect(processor);processor.connect(mute);mute.connect(ac.destination);
  const chunks=[[],[]],start=Date.now();let frames=0;
  processor.onaudioprocess=e=>{
   const length=e.inputBuffer.length;
   if(frames+length>ac.sampleRate*300){saveButton.click();return}
   for(let ch=0;ch<2;ch++){const data=e.inputBuffer.getChannelData(Math.min(ch,e.inputBuffer.numberOfChannels-1));chunks[ch].push(new Float32Array(data))}
   frames+=length;
  };
  capture={ac,worklet,dest,input,processor,mute,chunks,start,get frames(){return frames}};
  recButton.disabled=true;saveButton.disabled=false;message('RECORDING · WAV / 16-bit · 5 min maximum');
 }catch(e){message('Recording failed: '+e.message)}
};
saveButton.onclick=()=>{
 if(!capture)return;
 const r=capture;capture=null;r.processor.onaudioprocess=null;
 try{r.worklet.disconnect(r.dest);r.input.disconnect();r.processor.disconnect();r.mute.disconnect()}catch{}
 recButton.disabled=false;saveButton.disabled=true;
 if(!r.frames){message('No audio captured');return}
 const channels=r.chunks.map(list=>{const out=new Float32Array(r.frames);let offset=0;for(const chunk of list){out.set(chunk,offset);offset+=chunk.length}return out});
 const url=URL.createObjectURL(wavBlob(channels,r.ac.sampleRate)),a=document.createElement('a');a.href=url;a.download='SuperCollision-'+Date.now()+'.wav';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
 message('WAV exported · '+Math.round(r.frames/r.ac.sampleRate)+' seconds');
};
</script></html>
