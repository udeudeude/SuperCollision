<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sounds · SuperCollision</title>
<meta name="robots" content="noindex">
<script>
/* Legacy Sounds bookmarks share this origin and its IndexedDB library.
   Never clear storage or copy records. Replace history to avoid redirect loops. */
(function(){
 const route=location.hash.replace(/^#/,'').toLowerCase();
 const destinations={
  library:['details',null],create:['play',null],generate:['play','generate'],
  import:['sample','import'],record:['sample','record'],
  discover:['sample','discover-audio'],sample:['sample',null],
  play:['play',null],details:['details',null]
 };
 const [view,action]=destinations[route]||['details',null];
 const target=new URL('./sounds-bench-preview.html',location.href);
 const params=new URLSearchParams(location.search);
 params.delete('legacy-action');
 if(action)params.set('legacy-action',action);
 target.search=params.toString();
 target.hash=view;
 location.replace(target.href);
})();
</script>
</head>
<body>
<p>Sounds has moved to <a href="./sounds-bench-preview.html#details">SuperCollision Instrument Bench</a>. Your saved sounds remain on this device.</p>
</body>
</html>
